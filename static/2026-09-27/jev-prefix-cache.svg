<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">全库固定前缀与动态知识子集</title><desc id="desc">全库前缀不变，问题放在末尾；选类后条目组合变化，即使两次都有知识C，也未必共享它之前的完整前缀。本图仅为机制示意。</desc><rect width="960" height="410" rx="16" fill="#f6f8fb"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#243248"><text x="36" y="44" font-size="23" font-weight="700">相同条目，不一定处在相同前缀里</text><text x="36" y="91" font-size="17" font-weight="700">全库：前面的规则与知识保持一致</text><rect x="36" y="110" width="618" height="78" rx="7" fill="#e3efe9"/><text x="50" y="140" font-size="17">请求 1　规则 → 知识 A → 知识 B → 知识 C</text><text x="50" y="174" font-size="17">请求 2　规则 → 知识 A → 知识 B → 知识 C</text><text x="680" y="140" font-size="17">→ 玩家问题 1</text><text x="680" y="174" font-size="17">→ 玩家问题 2</text><text x="36" y="233" font-size="17" font-weight="700">按类筛选：知识子集随问题变化</text><rect x="36" y="252" width="618" height="78" rx="7" fill="#fff0dc"/><text x="50" y="282" font-size="17">请求 1　规则 → 知识 A → 知识 C</text><text x="50" y="316" font-size="17">请求 2　规则 → 知识 B → 知识 C</text><text x="680" y="282" font-size="17">→ 玩家问题 1</text><text x="680" y="316" font-size="17">→ 玩家问题 2</text><text x="36" y="366" font-size="14" fill="#607087">两次都有知识 C，但它前面的内容不同，不能把知识 C 当作独立缓存块。</text><text x="36" y="391" font-size="12" fill="#607087">机制示意，不是实际请求逐 token 展示；本轮缓存差异并非完全受控的因果实验。</text></g></svg>