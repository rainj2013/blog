<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380"><rect width="820" height="380" fill="#fffdf3"/><g font-family="sans-serif" fill="#3d3422"><text x="24" y="32" font-size="20">完整回复平均耗时：前处理 + 最终生成</text><text x="24" y="95" font-size="14">全库回答</text><rect x="250" y="75" width="0.04" height="30" fill="#c48a46"/><rect x="250.04" y="75" width="262.70" height="30" fill="#5ab85a"/><text x="522.70" y="95" font-size="14">1.321 秒</text><text x="24" y="157" font-size="14">JEV</text><rect x="250" y="137" width="69.01" height="30" fill="#c48a46"/><rect x="319.01" y="137" width="280.80" height="30" fill="#5ab85a"/><text x="609.80" y="157" font-size="14">1.760 秒</text><text x="24" y="219" font-size="14">RAG，固定取 3 类</text><rect x="250" y="199" width="0.04" height="30" fill="#c48a46"/><rect x="250.04" y="199" width="272.05" height="30" fill="#5ab85a"/><text x="532.05" y="219" font-size="14">1.368 秒</text><rect x="24" y="304" width="16" height="16" rx="2" fill="#c48a46"/><text x="48" y="317" font-size="13">分类 / 检索前处理</text><rect x="210" y="304" width="16" height="16" rx="2" fill="#5ab85a"/><text x="234" y="317" font-size="13">最终 DeepSeek 生成</text><text x="24" y="350" font-size="13" fill="#6e5d44">注：JEV 前处理包含 Jev 分类耗时；RAG 前处理包含本地检索耗时。</text></g></svg>
