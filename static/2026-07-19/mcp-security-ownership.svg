<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MCP 安全方案放在不同模型后的数据链路</title>
  <desc id="desc">A 和 B 将安全方案放进服务器基本信息，未进入工具规格持久化链；C 将安全方案放进工具规格，完整经过导入、持久化、查询和编辑。</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="60" y="60" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">安全方案应该跟着“服务器资料”还是“工具规格”走？</text>
  <text x="60" y="96" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">securitySchemes 描述工具调用如何认证，需要经过工具配置的导入、持久化、查询和再次编辑</text>

  <rect x="50" y="135" width="1100" height="230" rx="20" fill="#fff" stroke="#fca5a5" stroke-width="2"/>
  <rect x="50" y="135" width="170" height="230" rx="20" fill="#fee2e2"/>
  <text x="135" y="205" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#991b1b">A / B</text>
  <text x="135" y="240" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#991b1b">页面能配置</text>
  <text x="135" y="270" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#991b1b">完整往返失败</text>
  <rect x="260" y="190" width="190" height="80" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="355" y="222" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#7c2d12">OpenAPI / Console</text>
  <text x="355" y="250" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#7c2d12">产生安全方案</text>
  <line x1="462" y1="230" x2="520" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#arrow2)"/>
  <rect x="535" y="180" width="220" height="100" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="645" y="216" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#7c2d12">McpServerBasicInfo</text>
  <text x="645" y="246" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#7c2d12">名称、地址等服务器资料</text>
  <line x1="768" y1="230" x2="845" y2="230" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 7"/>
  <line x1="818" y1="205" x2="850" y2="255" stroke="#dc2626" stroke-width="5"/>
  <line x1="850" y1="205" x2="818" y2="255" stroke="#dc2626" stroke-width="5"/>
  <rect x="870" y="180" width="230" height="100" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="985" y="216" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#334155">McpToolSpecification</text>
  <text x="985" y="246" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">工具规格持久化链</text>
  <text x="645" y="326" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#b91c1c">字段放在另一份模型里，查询工具规格时读不到安全方案</text>

  <rect x="50" y="395" width="1100" height="260" rx="20" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <rect x="50" y="395" width="170" height="260" rx="20" fill="#dcfce7"/>
  <text x="135" y="474" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700" fill="#166534">C</text>
  <text x="135" y="510" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#166534">进入唯一权威链路</text>
  <text x="135" y="540" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#166534">复杂字段完整保留</text>
  <rect x="250" y="465" width="175" height="84" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="338" y="499" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">OpenAPI / Console</text>
  <text x="338" y="526" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">创建或编辑</text>
  <line x1="437" y1="507" x2="485" y2="507" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="500" y="455" width="225" height="104" rx="14" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="613" y="493" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#14532d">McpToolSpecification</text>
  <text x="613" y="522" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">工具 + 元数据 + 安全方案</text>
  <line x1="737" y1="507" x2="785" y2="507" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="800" y="465" width="135" height="84" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <text x="868" y="499" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">持久化</text>
  <text x="868" y="526" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">并查询</text>
  <line x1="947" y1="507" x2="985" y2="507" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="1000" y="465" width="120" height="84" rx="14" fill="#dcfce7" stroke="#4ade80"/>
  <text x="1060" y="499" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">再次编辑</text>
  <text x="1060" y="526" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">仍能保留</text>
  <text x="613" y="609" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#166534">跨层往返测试验证的是整条数据生命周期，字段存在检查只能覆盖其中一个点</text>
  <text x="60" y="692" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748b">示意图省略了具体类和方法，只保留理解问题所需的应用级边界。</text>
</svg>
