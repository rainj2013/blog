<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">三种 Codex 实验工作流</title>
  <desc id="desc">直接实现、先计划后实现、架构计划加独立审查三种工作流的步骤与输入差异。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="24" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">同一个任务，三种使用 Codex 的方式</text>
  <text x="60" y="98" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">模型、基线和推理强度保持一致，差异来自输入内容与执行流程</text>

  <rect x="52" y="135" width="1096" height="145" rx="18" fill="#ffffff" stroke="#fca5a5" filter="url(#shadow)"/>
  <rect x="52" y="135" width="126" height="145" rx="18" fill="#fee2e2"/>
  <text x="115" y="196" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#991b1b">A</text>
  <text x="115" y="232" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#991b1b">直接实现</text>
  <rect x="220" y="175" width="210" height="66" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="325" y="216" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#7c2d12">原始需求</text>
  <line x1="442" y1="208" x2="515" y2="208" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="530" y="175" width="220" height="66" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <text x="640" y="216" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#7c2d12">实现 + 自选测试</text>
  <line x1="762" y1="208" x2="835" y2="208" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="850" y="175" width="240" height="66" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="970" y="202" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#991b1b">Agent 自己判断</text>
  <text x="970" y="228" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#991b1b">是否完成</text>

  <rect x="52" y="300" width="1096" height="145" rx="18" fill="#ffffff" stroke="#93c5fd" filter="url(#shadow)"/>
  <rect x="52" y="300" width="126" height="145" rx="18" fill="#dbeafe"/>
  <text x="115" y="361" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#1e40af">B</text>
  <text x="115" y="397" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#1e40af">先做计划</text>
  <rect x="205" y="340" width="190" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="300" y="381" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#1e3a8a">原始需求</text>
  <line x1="407" y1="373" x2="455" y2="373" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="470" y="340" width="210" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="575" y="367" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#1e3a8a">只读分析</text>
  <text x="575" y="393" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#1e3a8a">输出自己的计划</text>
  <line x1="692" y1="373" x2="740" y2="373" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="755" y="340" width="190" height="66" rx="12" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="850" y="381" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#1e3a8a">同会话实现</text>
  <line x1="957" y1="373" x2="1005" y2="373" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1020" y="340" width="95" height="66" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="1068" y="381" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#1e3a8a">测试</text>

  <rect x="52" y="465" width="1096" height="185" rx="18" fill="#ffffff" stroke="#86efac" filter="url(#shadow)"/>
  <rect x="52" y="465" width="126" height="185" rx="18" fill="#dcfce7"/>
  <text x="115" y="535" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="26" font-weight="700" fill="#166534">C</text>
  <text x="115" y="571" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#166534">架构保护</text>
  <text x="115" y="598" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#166534">闭环</text>
  <rect x="198" y="515" width="175" height="82" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="286" y="546" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">完整验收条件</text>
  <text x="286" y="574" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">+ 架构约束</text>
  <line x1="385" y1="556" x2="423" y2="556" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="438" y="515" width="175" height="82" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="526" y="546" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">架构影响分析</text>
  <text x="526" y="574" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">覆盖全部要求</text>
  <line x1="625" y1="556" x2="663" y2="556" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="678" y="515" width="145" height="82" rx="12" fill="#f0fdf4" stroke="#86efac"/>
  <text x="751" y="564" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#14532d">实现 + 测试</text>
  <line x1="835" y1="556" x2="873" y2="556" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="888" y="515" width="185" height="82" rx="12" fill="#dcfce7" stroke="#4ade80"/>
  <text x="981" y="546" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">全新上下文审查</text>
  <text x="981" y="574" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#14532d">根据问题修复一轮</text>
  <text x="60" y="681" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748b">C 同时增加了更完整的需求、架构分析和独立审查，实验比较的是三套实际使用方式。</text>
</svg>
