<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">配置历史自动清理的安全运行链路</title>
  <desc id="desc">历史清理任务从配置校验、执行节点判断、分批删除、记录结果到下一次调度的完整链路，以及三种实现暴露的风险。</desc>
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/>
  <text x="60" y="60" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" fill="#0f172a">一个生产可用的历史清理任务，需要完整走完五步</text>
  <text x="60" y="96" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#475569">删除 SQL 只是中间一步，配置、集群、批次、异常和生命周期共同决定运行安全</text>

  <rect x="55" y="150" width="190" height="110" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="150" cy="174" r="18" fill="#2563eb"/>
  <text x="150" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">1</text>
  <text x="150" y="211" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">读取并校验配置</text>
  <text x="150" y="239" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#334155">开关、保留天数、时间</text>
  <line x1="257" y1="205" x2="300" y2="205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow3)"/>

  <rect x="315" y="150" width="190" height="110" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <circle cx="410" cy="174" r="18" fill="#2563eb"/>
  <text x="410" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
  <text x="410" y="211" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">确认执行节点</text>
  <text x="410" y="239" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#334155">只允许一个节点执行</text>
  <line x1="517" y1="205" x2="560" y2="205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow3)"/>

  <rect x="575" y="150" width="190" height="110" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="670" cy="174" r="18" fill="#16a34a"/>
  <text x="670" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">3</text>
  <text x="670" y="211" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#14532d">通过 Mapper 分批删</text>
  <text x="670" y="239" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#334155">兼容不同数据库方言</text>
  <line x1="777" y1="205" x2="820" y2="205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow3)"/>

  <rect x="835" y="150" width="145" height="110" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="908" cy="174" r="18" fill="#16a34a"/>
  <text x="908" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">4</text>
  <text x="908" y="211" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#14532d">记录结果</text>
  <text x="908" y="239" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#334155">数量、耗时、失败</text>
  <line x1="992" y1="205" x2="1025" y2="205" stroke="#64748b" stroke-width="3" marker-end="url(#arrow3)"/>

  <rect x="1040" y="150" width="115" height="110" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <circle cx="1098" cy="174" r="18" fill="#16a34a"/>
  <text x="1098" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">5</text>
  <text x="1098" y="211" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#14532d">安排下次</text>
  <text x="1098" y="238" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#334155">支持服务关闭</text>

  <text x="60" y="330" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" font-weight="700" fill="#0f172a">三种实现的差异集中在“极端情况下会发生什么”</text>
  <rect x="55" y="365" width="340" height="290" rx="18" fill="#fff" stroke="#fca5a5" stroke-width="2"/>
  <rect x="55" y="365" width="340" height="58" rx="18" fill="#fee2e2"/>
  <text x="225" y="402" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#991b1b">A：直接实现</text>
  <text x="83" y="462" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 每批达到上限后继续，没有总上限</text>
  <text x="83" y="504" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 非法配置回退默认值后继续删除</text>
  <text x="83" y="546" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 旧 retention 配置未兼容</text>
  <text x="83" y="588" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 每批先 count，日志数量可能失真</text>
  <text x="83" y="630" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#b91c1c">结果：公开测试通过，隐藏场景失败</text>

  <rect x="430" y="365" width="340" height="290" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="430" y="365" width="340" height="58" rx="18" fill="#dbeafe"/>
  <text x="600" y="402" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#1e40af">B：先做计划</text>
  <text x="458" y="462" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 复用执行节点规则和数据库接口</text>
  <text x="458" y="504" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 新旧配置兼容，异常后重新调度</text>
  <text x="458" y="546" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 用首次 count 快照限制循环次数</text>
  <text x="458" y="588" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 实际删除数仍可能与日志有偏差</text>
  <text x="458" y="630" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">结果：功能通过，仅修改配置模块</text>

  <rect x="805" y="365" width="350" height="290" rx="18" fill="#fff" stroke="#86efac" stroke-width="2"/>
  <rect x="805" y="365" width="350" height="58" rx="18" fill="#dcfce7"/>
  <text x="980" y="402" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" fill="#166534">C：架构保护闭环</text>
  <text x="833" y="462" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 每批 1000，单轮最多 1000 批</text>
  <text x="833" y="504" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 返回数据库真实影响行数</text>
  <text x="833" y="546" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 节点判断异常后仍会再次调度</text>
  <text x="833" y="588" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#334155">• 代价是改动扩展到三个模块</text>
  <text x="833" y="630" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700" fill="#15803d">结果：可靠性更强，维护面也更大</text>
  <text x="60" y="716" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#64748b">应用级架构既包含代码分层，也包含模块职责、数据归属、集群执行权和后台任务生命周期。</text>
</svg>
